name: Build CV

on:
  push:
    paths:
      - amr-cv.typ
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4

      - name: Compile
        run: typst compile amr-cv.typ amr-cv.pdf

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add amr-cv.pdf
          git diff --staged --quiet || git commit -m "chore(cv): rebuild amr-cv.pdf [skip ci]"
          git push
